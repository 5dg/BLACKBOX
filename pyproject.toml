[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-security-operations"
version = "0.1.0"
description = "A safe, AI-assisted security investigation portfolio platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "5dg"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.setuptools.packages.find]
include = ["blackbox_api*"]
